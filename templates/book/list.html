<!DOCTYPE html>
<html>
<head>
    <title>Books</title>
</head>
<body>

<h1>Book List</h1>

<a href="{% url 'book_create' %}">
    Add Book
</a>

<hr>

{% for book in books %}

    <h3>
        <a href="{% url 'book_detail' book.id %}">
            {{ book.title }}
        </a>
    </h3>

    <p>{{ book.author }}</p>

    <a href="{% url 'book_update' book.id %}">
        Edit
    </a>

    <a href="{% url 'book_delete' book.id %}">
        Delete
    </a>

    <hr>

{% endfor %}

</body>
</html>
