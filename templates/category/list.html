<!DOCTYPE html>
<html>
<head>
    <title>Categories</title>
</head>
<body>

    <h1>Category List</h1>

    {% for category in categories %}
        <div>
            <a href="{% url 'category_products' category.id %}">
                {{ category.name }}
            </a>
        </div>
    {% endfor %}

</body>
</html>
