<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>

    <h1>{{ category.name }} Products</h1>

    {% for product in products %}
        <div style="border:1px solid black; margin:10px; padding:10px;">
            <h3>{{ product.name }}</h3>
            <p>Price: {{ product.price }}</p>
        </div>
    {% endfor %}

</body>
</html>
